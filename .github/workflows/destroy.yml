name: "Terraform Destroy"

on:
  workflow_dispatch: # This enables the manual button in GitHub UI

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: "Vault Authenticate & Destroy"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import AWS Secrets From Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          role: github-actions-role              
          secrets: |
            aws/creds/gha-s3-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/gha-s3-role secret_key | AWS_SECRET_ACCESS_KEY

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve